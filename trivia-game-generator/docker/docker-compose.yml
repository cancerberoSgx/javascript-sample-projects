# Whole app for development: Postgres + FastAPI backend + Vite frontend.
#
#   ./docker/init-env.sh              # once: creates ../.env with generated secrets
#   docker compose -f docker/docker-compose.yml up --build
#
# Variables come from the repo-root .env (docker/.env is a symlink to it, which is
# where Compose looks for interpolation values).
name: trivia

services:
  db:
    image: postgres:18-alpine
    env_file: ../.env
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ../backend
    env_file: ../.env
    environment:
      # Overrides the localhost URL in .env: inside the network the db is reachable as "db"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      # Live code reload; the virtualenv stays inside the image
      - ../backend/app:/app/app
      - ../backend/migrations:/app/migrations
      - ../backend/seeds:/app/seeds
      - ../backend/tests:/app/tests
      # Background images (MEDIA_DIR, rules.md BKG-3): kept across rebuilds, like the database
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      VITE_API_PROXY: http://backend:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ../frontend:/app
      # Container-only node_modules, so host and container installs don't clash
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  frontend_node_modules:
