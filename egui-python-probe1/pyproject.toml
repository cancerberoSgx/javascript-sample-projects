[project]
name = "egui-python-probe1"
version = "0.1.0"
description = "Minimal interactive egui UI in Python using pyegui"
requires-python = ">=3.11"
dependencies = [
    "pillow>=13.0.0",
    "pyegui>=0.5.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.uv.sources]
# local fork with extra functions, see vendor/pyegui/EXTENSIONS.md
pyegui = { path = "vendor/pyegui" }
